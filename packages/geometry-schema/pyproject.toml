[project]
name = "geometry-schema"
version = "0.1.0"
description = "GeometryIR - CAD-neutral geometry intermediate representation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "shared-types"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geometry_schema"]
[tool.uv.sources]
shared-types = { workspace = true }
