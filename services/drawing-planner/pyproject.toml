[project]
name = "drawing-planner"
version = "0.1.0"
description = "DrawingPlan generation (deterministic defaults + LLM) - not implemented yet"
requires-python = ">=3.12"
dependencies = ["drawing-schema", "geometry-schema"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawing_planner"]

[tool.uv.sources]
geometry-schema = { workspace = true }
drawing-schema = { workspace = true }
