[project]
name = "drawing-compiler"
version = "0.1.0"
description = "DrawingPlan -> CompiledDrawing: deterministic sheet layout and dimension placement"
requires-python = ">=3.12"
dependencies = ["drawing-schema", "geometry-schema"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawing_compiler"]

[tool.uv.sources]
geometry-schema = { workspace = true }
drawing-schema = { workspace = true }
