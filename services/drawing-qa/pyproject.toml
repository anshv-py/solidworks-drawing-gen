[project]
name = "drawing-qa"
version = "0.1.0"
description = "Deterministic drawing QA and repair actions"
requires-python = ">=3.12"
dependencies = ["drawing-schema", "geometry-schema", "drawing-planner"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawing_qa"]

[tool.uv.sources]
geometry-schema = { workspace = true }
drawing-schema = { workspace = true }
drawing-planner = { workspace = true }
